<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Git Switch v2：青蓝渐变圆角底 + 白色双向切换箭头 + 中央刻入式 Git 菱形 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- 渐变圆角底（现代 App 图标风格） -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="5"/>
  <!-- 一体式双向箭头（白色） -->
  <rect x="140" y="228" width="232" height="56" rx="28" fill="#FFFFFF"/>
  <path d="M216 216 L216 296 L120 256 Z" fill="#FFFFFF"/>
  <path d="M296 216 L296 296 L392 256 Z" fill="#FFFFFF"/>
  <!-- 中央刻入式 Git 菱形（露出底色深处，象征 git） -->
  <polygon points="256,232 280,256 256,280 232,256" fill="#0D1526"/>
</svg>
